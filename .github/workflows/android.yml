name: Android
# Builds the Android app, tests it on an emulator (screen tour + tracking with the screen off),
# and on main publishes the APK at the download link:
# https://github.com/alonmaltzov/ski-nav/releases/download/android/SkiNav.apk
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'nyc.html', 'qa/tour.js', 'qa/android_qa.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'index.html', 'nyc.html', 'qa/tour.js', 'qa/android_qa.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Build + QA on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Signing key
        env: { KS: '${{ secrets.SKINAV_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/skinav.jks"
            echo "SKINAV_KEYSTORE=$RUNNER_TEMP/skinav.jks" >> $GITHUB_ENV
            echo "SKINAV_KEYSTORE_PASSWORD=skinav-android" >> $GITHUB_ENV
            echo "signing with the Ski Nav key"
          else
            echo "::warning::SKINAV_KEYSTORE_B64 secret missing: debug-signed build, not published"
          fi
      - name: Build APK
        working-directory: android
        env: { SKINAV_BUILD: '${{ github.run_number }}' }
        run: gradle assembleRelease --console=plain && cp app/build/outputs/apk/release/app-release.apk ../SkiNav.apk && ls -la ../SkiNav.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: pip install websocket-client
      - name: QA on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -memory 4096 -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 qa/android_qa.py SkiNav.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-android, path: qa-out }
      - name: Publish download link
        if: github.ref == 'refs/heads/main' && env.SKINAV_KEYSTORE != ''
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Ski Nav for Android" --notes "Install: open this link on your Android phone, download SkiNav.apk, allow installing from your browser once."
          gh release upload android SkiNav.apk --clobber
          echo "::notice::Android build ${{ github.run_number }} published: https://github.com/${{ github.repository }}/releases/download/android/SkiNav.apk"
