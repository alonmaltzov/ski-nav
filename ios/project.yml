name: SkiNav
options:
  bundleIdPrefix: com.alonmaltzov
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "76XJNX964Q"   # Alon's paid Apple Developer team
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SkiNav:
    type: application
    platform: iOS
    sources:
      - path: SkiNav
        excludes: ["www/**", "Simulate/**"]
      - path: SkiNav/Simulate
        buildPhase: none
      - path: SkiNav/www
        type: folder
        buildPhase: resources
      - path: Shared
        excludes: ["Replay/**", "TestData/**", "GlanceCheck/**"]
    info:
      path: SkiNav/Info.plist
      properties:
        CFBundleDisplayName: Ski-Paz
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.skinav.join
            CFBundleURLSchemes: [skinav]
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Ski-Paz shows where you are on the piste map and tracks your speed and distance.
        NSLocationAlwaysAndWhenInUseUsageDescription: Ski-Paz keeps tracking your runs while your phone is locked in your pocket.
        NSMotionUsageDescription: Ski-Paz uses the compass to show which way you are facing, only when you turn it on.
        NSMicrophoneUsageDescription: Ski-Paz listens only while you hold or tap the guide's talk button, to answer your question.
        NSSpeechRecognitionUsageDescription: Ski-Paz turns your question into text on your iPhone to answer it. Nothing is sent anywhere.
        NSHealthShareUsageDescription: Ski-Paz starts the ski workout on your Apple Watch when you tap Start.
        NSHealthUpdateUsageDescription: Ski-Paz saves each ski day as a Downhill Skiing workout.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    entitlements:
      path: SkiNav/SkiNav.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alonmaltzov.SkiNav
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SkiNavWidgets
      - target: SkiNavWatch
  SkiNavWatch:
    type: application
    platform: watchOS
    sources:
      - SkiNavWatch
      - Shared/SkiEngine.swift
      - Shared/SkiText.swift
      - Shared/SkiGlance.swift
      - Shared/SkiStyle.swift
      - Shared/SkiFace.swift
      - Shared/SkiFaceViews.swift
    info:
      path: SkiNavWatch/Info.plist
      properties:
        CFBundleDisplayName: Ski-Paz
        WKApplication: true
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: com.alonmaltzov.SkiNav
        WKBackgroundModes: [workout-processing]
        NSLocationWhenInUseUsageDescription: Ski-Paz tracks speed and distance during your ski workout.
        NSHealthShareUsageDescription: Ski-Paz reads your workout data to show distance.
        NSHealthUpdateUsageDescription: Ski-Paz saves each ski day as a Downhill Skiing workout.
    entitlements:
      path: SkiNavWatch/SkiNavWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.alonmaltzov.SkiNav]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alonmaltzov.SkiNav.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SkiNavWatchWidgets
  SkiNavWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - SkiNavWatchWidgets
      - Shared/SkiEngine.swift
      - Shared/SkiFace.swift
      - Shared/SkiFaceViews.swift
      - Shared/SkiGlance.swift
      - Shared/SkiText.swift
      - Shared/SkiStyle.swift
    entitlements:
      path: SkiNavWatchWidgets/SkiNavWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alonmaltzov.SkiNav]
    info:
      path: SkiNavWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ski-Paz
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alonmaltzov.SkiNav.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: Ski-Paz
  SkiNavWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SkiNavWidgets
      - Shared/SkiActivity.swift
      - Shared/SkiGlance.swift
      - Shared/SkiText.swift
      - Shared/SkiEngine.swift
      - Shared/SkiStyle.swift
      - Shared/SkiLiveViews.swift
    info:
      path: SkiNavWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ski-Paz
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alonmaltzov.SkiNav.widgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Ski-Paz
schemes:
  SkiNav:
    build:
      targets:
        SkiNav: all
        SkiNavWidgets: all
        SkiNavWatch: all
        SkiNavWatchWidgets: all
  SkiNavWatch:
    build:
      targets:
        SkiNavWatch: all
        SkiNavWatchWidgets: all
    run:
      config: Debug
