name: Build + QA
on:
  push:
    branches: [main]
    paths: ['ios/**', 'index.html', 'nyc.html', 'qa/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'index.html', 'nyc.html', 'qa/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa
  cancel-in-progress: true
jobs:
  web-qa:
    name: QA in headless Chrome (iPhone 16 + SE sizes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: qa }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Playwright
        timeout-minutes: 10
        run: pip install playwright psycopg2-binary && python -m playwright install --with-deps chromium
      - name: Run tour
        run: python qa/run_web.py
      - name: Group test (organizer + friend, against the real schema on Postgres)
        timeout-minutes: 8
        env: { PGPASSWORD: qa }
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin;"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql -q
          python qa/fake_supabase.py 54400 "host=127.0.0.1 user=postgres password=qa dbname=postgres" &
          sleep 2
          GROUP_URL=http://127.0.0.1:54400 python qa/group_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-web, path: qa-out }

  ios-qa:
    name: Build iPhone + Watch, QA in iOS Simulator
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen && xcodebuild -version
      - name: Native engine matches the web app (GPS replays)
        run: bash qa/engine_check.sh qa-out/engine
      - name: Generate project
        working-directory: ios
        run: |
          mkdir -p SkiNav/www
          cp ../index.html SkiNav/www/index.html
          cp ../nyc.html SkiNav/www/nyc.html
          cp ../qa/tour.js SkiNav/www/qa-tour.js
          xcodegen generate
      - name: Build (simulator, no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project SkiNav.xcodeproj -scheme SkiNav -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Check the bundle
        working-directory: ios
        run: |
          APP=dd/Build/Products/Debug-iphonesimulator/SkiNav.app
          ls "$APP/Watch" && echo "::notice::Watch app embedded: $(ls $APP/Watch)"
          ls -la "$APP/www"
          for f in index.html nyc.html qa-tour.js; do test -f "$APP/www/$f" || { echo "::error::$f missing from app bundle"; exit 1; }; done
          ls "$APP/PlugIns" && echo "::notice::Extensions embedded: $(ls $APP/PlugIns)"
          mkdir -p ../qa-out/ios-sim
          grep "warning:" build.log | grep -v "/dd/" | sort -u | head -20 > ../qa-out/ios-sim/build-warnings.txt || true
      - name: Run QA tour in the simulator
        timeout-minutes: 20
        run: |
          mkdir -p qa-out/ios-sim
          perl -e 'alarm shift; exec @ARGV' 900 bash qa/sim_run.sh ios/dd/Build/Products/Debug-iphonesimulator/SkiNav.app qa-out/ios-sim 2>&1 | tee qa-out/ios-sim/runner-console.txt || echo "::warning::simulator QA exited early"
          grep -q "QA DONE" qa-out/ios-sim/log.txt 2>/dev/null || echo '[web] QA RESULT {"check":"simulator QA ran to the end","ok":false,"detail":"see runner-console.txt"}' >> qa-out/ios-sim/log.txt
      - name: Shut down simulators
        if: always()
        timeout-minutes: 3
        run: |
          pkill -f "simctl launch" || true
          xcrun simctl shutdown all || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-ios, path: qa-out }
      - name: Report build errors
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:" build.log | sort -u | head -40 | while read -r line; do echo "::error::${line}"; done

  report:
    name: Publish QA report
    needs: [web-qa, ios-qa]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Merge and summarise
        run: |
          mkdir -p qa-out
          for d in dl/*/; do cp -R "$d"* qa-out/ 2>/dev/null || true; done
          echo "commit: $GITHUB_SHA" > qa-out/COMMIT.txt
          echo "web-qa: ${{ needs.web-qa.result }} · ios-qa: ${{ needs.ios-qa.result }}" >> qa-out/COMMIT.txt
          python3 qa/report.py
          cat qa-out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Push to qa-reports branch
        run: |
          cd qa-out
          git init -q -b qa-reports
          git add -A
          git -c user.name="ski-nav QA" -c user.email="qa@users.noreply.github.com" commit -qm "QA for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-reports
