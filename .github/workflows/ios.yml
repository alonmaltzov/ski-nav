name: Build iPhone + Watch
on:
  push:
    paths: ['ios/**', 'index.html', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen && xcodebuild -version
      - name: Generate project
        working-directory: ios
        run: cp ../index.html SkiNav/www/index.html && xcodegen generate
      - name: Build (simulator, no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project SkiNav.xcodeproj -scheme SkiNav -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:|warning: .*(deprecated|unavailable)" build.log | sort -u | head -40 | while read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          tail -60 build.log | while read -r line; do echo "::notice::${line}"; done
