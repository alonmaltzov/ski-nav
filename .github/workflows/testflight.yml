name: TestFlight
# Builds the iPhone + Watch app, signs it with the App Store Connect API key and uploads it to TestFlight.
# Runs when native code changes land on main, or by hand from the Actions tab (Run workflow).
# Web-only changes don't need a new build: the app updates its pages over the air (OTA).
on:
  push:
    branches: [main, 'tf/**']
    paths: ['ios/**', '.github/workflows/testflight.yml']
  workflow_dispatch:
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          # App Store uploads need the iOS 26 SDK: use the newest Xcode 26 on the runner
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$X" || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$X"
          brew install xcodegen && xcodebuild -version
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$P8" && test -n "$KID" || { echo "::error::ASC_KEY_P8 / ASC_KEY_ID secrets missing"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s\n' "$P8" | tr -d '\r' > ~/private_keys/AuthKey_$KID.p8
          F=~/private_keys/AuthKey_$KID.p8
          # shape check only, never prints the key
          echo "key file: $(wc -l < $F) lines, $(wc -c < $F) bytes, BEGIN line: $(grep -c 'BEGIN PRIVATE KEY' $F), END line: $(grep -c 'END PRIVATE KEY' $F)"
          echo "key id length: ${#KID}"
          # pasted without the BEGIN/END lines: add them back
          if ! grep -q 'BEGIN PRIVATE KEY' $F; then
            { echo '-----BEGIN PRIVATE KEY-----'; grep -v '^$' $F; echo '-----END PRIVATE KEY-----'; } > $F.tmp && mv $F.tmp $F
            echo "added BEGIN/END lines"
          fi
          grep -q 'BEGIN PRIVATE KEY' $F && grep -q 'END PRIVATE KEY' $F || { echo "::error::ASC_KEY_P8 isn't the .p8 file text. Paste the whole file, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----"; exit 1; }
          echo "KEY_PATH=$HOME/private_keys/AuthKey_$KID.p8" >> $GITHUB_ENV
      - name: Free certificate slots (old CI certificates)
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: pip3 install --break-system-packages -q pyjwt cryptography && python3 ios/ci/clean_certs.py "$KEY_PATH" "$KID" "$ISS"
      - name: Generate project
        working-directory: ios
        run: |
          mkdir -p SkiNav/www
          cp ../index.html SkiNav/www/index.html
          cp ../nyc.html SkiNav/www/nyc.html
          cp ../qa/tour.js SkiNav/www/qa-tour.js
          xcodegen generate
      - name: Archive
        working-directory: ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD=$((100 + ${{ github.run_number }}))
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          # the generated Info.plists hard-code the build number, so stamp it into every one
          for f in SkiNav/Info.plist SkiNavWatch/Info.plist SkiNavWidgets/Info.plist SkiNavWatchWidgets/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$f" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$f"
            echo "$f -> $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$f")"
          done
          xcodebuild -project SkiNav.xcodeproj -scheme SkiNav -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/SkiNav.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            CURRENT_PROJECT_VERSION=$BUILD DEVELOPMENT_TEAM=76XJNX964Q \
            archive 2>&1 | tee archive.log | grep -E 'error:|warning: .*(sign|profile)|ARCHIVE' || true
          test -d build/SkiNav.xcarchive || { tail -60 archive.log; exit 1; }
      - name: Upload to TestFlight
        working-directory: ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/SkiNav.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            2>&1 | tee export.log | tail -40
          grep -q 'EXPORT SUCCEEDED\|Upload succeeded\|Uploaded' export.log || { echo "::error::upload failed"; exit 1; }
          echo "::notice::Build 1.0 ($BUILD) uploaded. It shows in TestFlight after Apple finishes processing (5-15 min)."
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: testflight-logs, path: 'ios/*.log' }
      - name: Revoke this run's certificate
        if: always()
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: test -f "$KEY_PATH" && python3 ios/ci/clean_certs.py "$KEY_PATH" "$KID" "$ISS" || true
      - name: Clean up key
        if: always()
        run: rm -rf ~/private_keys
