name: SkiNav
options:
  bundleIdPrefix: com.alonmaltzov
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SkiNav:
    type: application
    platform: iOS
    sources:
      - path: SkiNav
        excludes: ["www/**", "Simulate/**"]
      - path: SkiNav/Simulate
        buildPhase: none
      - path: SkiNav/www
        type: folder
        buildPhase: resources
      - path: Shared
        excludes: ["Replay/**", "TestData/**"]
    info:
      path: SkiNav/Info.plist
      properties:
        CFBundleDisplayName: Ski Nav
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Ski Nav shows where you are on the piste map and tracks your speed and distance.
        NSLocationAlwaysAndWhenInUseUsageDescription: Ski Nav keeps tracking your runs while your phone is locked in your pocket.
        NSMotionUsageDescription: Ski Nav uses the compass to show which way you are facing, only when you turn it on.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alonmaltzov.SkiNav
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SkiNavWidgets
      - target: SkiNavWatch
  SkiNavWatch:
    type: application
    platform: watchOS
    sources:
      - SkiNavWatch
      - Shared/SkiEngine.swift
    info:
      path: SkiNavWatch/Info.plist
      properties:
        CFBundleDisplayName: Ski Nav
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.alonmaltzov.SkiNav
        WKBackgroundModes: [workout-processing]
        NSLocationWhenInUseUsageDescription: Ski Nav tracks speed and distance during your ski workout.
        NSHealthShareUsageDescription: Ski Nav reads your workout data to show distance.
        NSHealthUpdateUsageDescription: Ski Nav saves each ski day as a Downhill Skiing workout.
    entitlements:
      path: SkiNavWatch/SkiNavWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alonmaltzov.SkiNav.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SkiNavWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SkiNavWidgets
      - Shared/SkiActivity.swift
    info:
      path: SkiNavWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ski Nav
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alonmaltzov.SkiNav.widgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Ski Nav
schemes:
  SkiNav:
    build:
      targets:
        SkiNav: all
        SkiNavWidgets: all
        SkiNavWatch: all
