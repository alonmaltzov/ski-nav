name: Build iPhone + Watch
on:
  push:
    paths: ['ios/**', 'index.html', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen && xcodebuild -version
      - name: Generate project
        working-directory: ios
        run: cp ../index.html SkiNav/www/index.html && xcodegen generate
      - name: Build (simulator, no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project SkiNav.xcodeproj -scheme SkiNav -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Check the watch app is inside the iPhone app
        working-directory: ios
        run: |
          APP=dd/Build/Products/Debug-iphonesimulator/SkiNav.app
          ls "$APP/Watch" && echo "::notice::Watch app embedded: $(ls $APP/Watch)"
          ls -la "$APP/www" && echo "::notice::Web app size $(du -h $APP/www/index.html | cut -f1)"
          grep -c "warning:" build.log | xargs -I{} echo "::notice::{} warnings"
          grep "warning:" build.log | grep -v "/dd/" | sort -u | head -15 | while read -r l; do echo "::warning::$l"; done
      - name: Run in an iPhone simulator and capture the app's console
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" dd/Build/Products/Debug-iphonesimulator/SkiNav.app
          (xcrun simctl launch --console-pty "$UDID" com.alonmaltzov.SkiNav > app.log 2>&1 &)
          sleep 40
          xcrun simctl io "$UDID" screenshot shot.png || true
          grep -E "\[app\]|\[web\]" app.log | head -60 | while read -r l; do echo "::notice::$l"; done
          echo "::notice::app.log lines: $(wc -l < app.log)"
          tail -25 app.log | while read -r l; do echo "::notice::tail: $l"; done
      - name: Report errors
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:|warning: .*(deprecated|unavailable)" build.log | sort -u | head -40 | while read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          tail -60 build.log | while read -r line; do echo "::notice::${line}"; done
